[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanc"
version = "0.1.0"
description = "Topological Data Analysis for Neural Networks — a composable extraction → graph → topology → visualisation pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# AGPL-3.0, not a permissive licence: giotto-tda (a required dependency) is
# AGPLv3, so a combined work cannot be distributed under MIT terms.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["topological-data-analysis", "persistent-homology", "mapper", "neural-networks", "tda"]

# Cross-platform CPU install. pip selects the correct per-platform wheel from the
# same name+version on Windows / macOS (Intel + Apple Silicon) / Linux.
# For NVIDIA CUDA builds of torch, install from the PyTorch index separately.
dependencies = [
    # --- Scientific core (always required) ---
    "numpy==1.26.4",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "scikit-learn==1.3.2",
    "matplotlib==3.10.8",
    "networkx==3.6.1",

    # --- Topological data analysis (always required) ---
    "giotto-tda==0.6.2",       # gtda — persistence + Mapper backend
    "gudhi==3.12.0",
    "ripser==0.6.14",
    "persim==0.3.8",
    "POT==0.9.6.post1",        # imported as `ot` (Wasserstein distances in Mapper)

    # --- ML backends (both required; either may be used for a given model) ---
    "torch==2.2.2",
    "torchvision==0.17.2",
    "tensorflow==2.16.2",
    "keras==3.14.0",

    # --- Jupyter / notebook (the toolkit is driven from notebooks) ---
    "jupyterlab==4.5.6",
    "ipykernel==7.2.0",
    "ipywidgets==8.1.8",
]

[project.optional-dependencies]
# Bundled examples / paper-reproduction scripts (not imported by the library).
examples = [
    "seaborn==0.13.2",
    "plotly==6.6.0",
    "hdbscan==0.8.40",
    "umap-learn==0.5.6",   # last release compatible with the core scikit-learn==1.3.2 pin
                           # (giotto-tda needs sklearn<1.6; umap-learn>=0.5.8 needs >=1.6)
    "kmapper==2.1.0",
    "scikit-tda==1.1.1",
    "tadasets==0.2.2",
    "teaspoon==1.5.29",
    "tqdm==4.67.3",
]

# Documentation build (Sphinx + MyST); heavy deps are mocked in conf.py.
docs = [
    "sphinx",
    "myst-nb",
    "furo",
]

[tool.setuptools.packages.find]
include = ["tanc*"]

[tool.setuptools.package-data]
tanc = ["**/*.md"]
